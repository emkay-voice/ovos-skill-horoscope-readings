[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-skill-horoscope-readings"
version = "0.2.0a1"
description = "Reads daily zodiac horoscopes aloud. Provider for ovos-common-reading-pipeline-plugin - no standalone voice interface."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "emkay-voice"}]
requires-python = ">=3.10"
keywords = ["ovos", "openvoiceos", "skill", "voice", "assistant", "horoscope", "astrology", "zodiac", "storytelling", "emkay"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Home Automation",
]
dependencies = [
    "ovos-workshop>=0.0.15,<10.0.0",
    "requests",
    "ovos-plugin-manager",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/emkay-voice/ovos-skill-horoscope-readings"
Issues = "https://github.com/emkay-voice/ovos-skill-horoscope-readings/issues"
Emkay = "https://github.com/emkay-voice/emkay"
Icon = "https://raw.githubusercontent.com/emkay-voice/ovos-skill-horoscope-readings/main/book-512.png"

[project.entry-points."opm.skill"]
"ovos-skill-horoscope-readings.emkay-voice" = "ovos_skill_horoscope_readings:HoroscopeReadings"

[tool.setuptools]
packages = ["ovos_skill_horoscope_readings"]

[tool.setuptools.package-dir]
ovos_skill_horoscope_readings = ""

[tool.setuptools.package-data]
ovos_skill_horoscope_readings = ["locale/**/*", "*.png"]
